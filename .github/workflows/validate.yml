name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dev dependencies (8bit-sfx parity test)
        # Tolerated failure: the parity test skips with a note when the
        # package isn't resolvable, mirroring the runner's toolchain skips.
        run: npm install --no-audit --no-fund || echo "npm install failed; the sfx package parity test will skip"
      - name: Run tests
        run: |
          if [ -f tests/run-tests.sh ]; then
            bash tests/run-tests.sh
          else
            echo "No tests/run-tests.sh found; nothing to validate."
          fi
